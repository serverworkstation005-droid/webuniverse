<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web Universe | The Ultimate Digital Resource Directory</title>
    <!-- React Scan for Performance Monitoring (added per user request) -->
    <script src="https://unpkg.com/react-scan/dist/auto.global.js" async defer></script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" href="/favicon.svg" />
    <meta name="description" content="Web Universe: A curated universe of premium digital resources. Find 4K movies, pro software, elite gaming, anime, and tech tools in one high-speed directory." />
    <meta name="keywords" content="web universe, webuniverse, digital directory, premium resource index, 4k movies streaming, pro software download, gaming library, anime database, tech tools directory" />
    <meta name="author" content="Web Universe Team" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://webuniverse.app" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://webuniverse.app" />
    <meta property="og:title" content="Web Universe | The Ultimate Digital Resource Directory" />
    <meta property="og:description" content="Discover a curated universe of elite digital resources—from 4K cinema and premium games to advanced tech tools and academic libraries." />
    <meta property="og:image" content="https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&w=1200&h=630&auto=format&fit=crop" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://webuniverse.app" />
    <meta property="twitter:title" content="Web Universe | The Ultimate Digital Resource Directory" />
    <meta property="twitter:description" content="Discover a curated universe of elite digital resources—from 4K cinema and premium games to advanced tech tools and academic libraries." />
    <meta property="twitter:image" content="https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&w=1200&h=630&auto=format&fit=crop" />

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Web Universe",
      "url": "https://webuniverse.app",
      "description": "The ultimate digital gateway to premium resources including 4K movies, pro software, elite games, and tech tools.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://webuniverse.app/search?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
      body { background-color: #06040f; color: #f5f5f7; margin: 0; }
      .bg-instant-container { position: fixed; inset: 0; z-index: -3; background-color: #07040f; overflow: hidden; pointer-events: none; contain: strict; }
      .bg-instant-base { position: absolute; inset: 0; background-color: #06030b; }
      .bg-purple-glow { position: absolute; top: -15%; left: -10%; width: 55vw; height: 55vw; background-color: rgba(147, 51, 234, 0.25); filter: blur(140px); border-radius: 50%; mix-blend-mode: screen; transform: translateZ(0); }
      .bg-magenta-glow { position: absolute; top: 20%; right: -10%; width: 60vw; height: 60vw; background-color: rgba(192, 38, 211, 0.15); filter: blur(150px); border-radius: 50%; mix-blend-mode: screen; transform: translateZ(0); }
      .bg-indigo-glow { position: absolute; bottom: -20%; left: 10%; width: 80vw; height: 50vw; background-color: rgba(67, 56, 202, 0.20); filter: blur(150px); border-radius: 100%; mix-blend-mode: screen; transform: translateZ(0); }
      .bg-violet-glow { position: absolute; top: 35%; left: 35%; width: 50vw; height: 50vw; background-color: rgba(76, 29, 149, 0.15); filter: blur(130px); border-radius: 50%; mix-blend-mode: screen; transform: translateZ(0); }
      .bg-grain { position: fixed; inset: 0; z-index: -2; pointer-events: none; opacity: 0.05; mix-blend-mode: overlay; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E"); }
    </style>
  </head>
  <body class="bg-[#06040f] text-slate-100">
    <div class="bg-instant-container">
      <div class="bg-instant-base"></div>
      <div class="bg-purple-glow"></div>
      <div class="bg-magenta-glow"></div>
      <div class="bg-indigo-glow"></div>
      <div class="bg-violet-glow"></div>
      <div class="bg-grain"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
