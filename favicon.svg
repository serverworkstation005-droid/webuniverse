<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="header-shine" cx="50%" cy="0%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#ffffff" flood-opacity="0.6" />
    </filter>
  </defs>
  <!-- Background with rounded corners matching the branding -->
  <rect width="512" height="512" rx="140" fill="url(#gradient)" />
  <!-- Internal radial light overlay -->
  <rect width="512" height="512" rx="140" fill="url(#header-shine)" />
  <!-- Central rotated square (diamond shape) -->
  <rect x="181" y="181" width="150" height="150" rx="20" fill="#ffffff" transform="rotate(45 256 256)" filter="url(#glow)" />
</svg>
